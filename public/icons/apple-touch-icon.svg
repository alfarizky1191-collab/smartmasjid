  <!-- Mosque dome -->
  <ellipse cx="90" cy="68" rx="36" ry="28" fill="#ffffff"/>
  <polygon points="90,34 72,68 108,68" fill="#ffffff"/>

  <!-- Minaret left -->
  <rect x="40" y="64" width="14" height="50" rx="4" fill="#ffffff"/>
  <ellipse cx="47" cy="64" rx="7" ry="10" fill="#ffffff"/>
  <polygon points="47,46 40,64 54,64" fill="#d1fae5"/>

  <!-- Minaret right -->
  <rect x="126" y="64" width="14" height="50" rx="4" fill="#ffffff"/>
  <ellipse cx="133" cy="64" rx="7" ry="10" fill="#ffffff"/>
  <polygon points="133,46 126,64 140,64" fill="#d1fae5"/>

  <!-- Main body -->
  <rect x="54" y="96" width="72" height="38" rx="4" fill="#ffffff"/>

  <!-- Door arch -->
